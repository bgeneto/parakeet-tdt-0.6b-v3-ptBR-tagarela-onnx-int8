services:
  parakeet-stt:
    build:
      context: .
      dockerfile: Dockerfile
    # Local tag only — this name is not on Docker Hub. Never pull.
    image: parakeet-stt-ptbr:1.0.0
    pull_policy: never
    container_name: parakeet-stt
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - path: .env
        required: false
    environment:
      # Literals win over a leftover .env. User knobs come from env_file.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CUDA_MODULE_LOADING: LAZY
      MODEL_DIR: /opt/models/parakeet
      HF_HOME: /opt/models/parakeet/.hf
      # Host GPU is selected only via deploy.device_ids. Inside the container
      # that GPU is always CUDA device 0 — do not forward the host index.
      GPU_ID: "0"
      CUDNN_CONV_ALGO_SEARCH: HEURISTIC
      CUDNN_CONV_MAX_WORKSPACE: "1"
      ORT_ARENA_EXTEND: kNextPowerOfTwo
      HOST: "0.0.0.0"
      UPLOAD_DIR: /tmp/stt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
    volumes:
      - ${MODEL_HOST_DIR:-./models/parakeet}:/opt/models/parakeet
    shm_size: "1gb"
    ulimits:
      memlock: -1
      stack: 67108864
    tmpfs:
      - /tmp/stt:uid=1000,gid=1000,mode=1777,size=16g
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('PORT', '8080'), timeout=5)",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 600s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
